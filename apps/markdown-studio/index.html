<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Studio</title>
<link rel="icon" href="app.ico">
<link rel="stylesheet" href="vendor/github-dark.min.css">
<style>
  :root{
    --bg:#0b0e13; --panel:#11161e; --panel2:#171d27; --line:#232b38;
    --text:#e6edf3; --muted:#8b96a5; --dim:#5d6877;
    --accent:#6cb6ff; --accent-ink:#08111c;
    --inline-bg:#161b22; --inline-border:#30363d; --pre-bg:#0d1117; --pre-border:#30363d; --pre-text:#e6edf3;
    --danger:#ff7b72; --ok:#7ee787;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#d8dee4;
    --text:#1f2328; --muted:#59636e; --dim:#8c959f;
    --accent:#0969da; --accent-ink:#ffffff;
    --inline-bg:#f6f8fa; --inline-border:#d0d7de; --pre-bg:#0d1117; --pre-border:#30363d; --pre-text:#e6edf3;
    --danger:#cf222e; --ok:#1a7f37;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{font:inherit; cursor:pointer; color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .top{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:linear-gradient(180deg,var(--panel2),var(--panel)); border-bottom:1px solid var(--line);
    flex:0 0 auto; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; white-space:nowrap}
  .mark{width:12px; height:12px; border-radius:3px; background:var(--accent); box-shadow:0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}
  .filebox{min-width:0; flex:1; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px}
  .filebox .name{color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:42vw}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:0 0 auto}
  .actions{display:flex; align-items:center; gap:7px; flex:0 0 auto}
  .btn{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:7px 11px; font-size:12.5px; transition:background .15s,border-color .15s;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:color-mix(in srgb,var(--panel2) 70%,var(--accent) 8%); border-color:color-mix(in srgb,var(--line) 60%,var(--accent) 30%)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.icon{padding:7px 9px; min-width:34px}
  .seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px}
  .seg button{border:0; background:transparent; color:var(--muted); padding:6px 10px; border-radius:7px; font-size:12px}
  .seg button.active{background:var(--panel2); color:var(--text); box-shadow:0 1px 0 rgba(255,255,255,.04)}
  .toolbar{
    display:flex; align-items:center; gap:5px; padding:7px 12px; flex-wrap:wrap;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .toolbar .sep{width:1px; height:20px; background:var(--line); margin:0 4px}
  .tool{
    background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 8px;
    color:var(--muted); font-size:12.5px; min-width:30px;
  }
  .tool:hover{background:var(--panel2); color:var(--text); border-color:var(--line)}
  .tool b,.tool i,.tool s{font-size:13px}
  main{flex:1; min-height:0; position:relative; display:flex; flex-direction:column}
  .workspace{
    flex:1; min-height:0; display:grid;
    grid-template-columns:var(--split,50%) 6px 1fr;
  }
  .workspace.mode-editor{grid-template-columns:1fr}
  .workspace.mode-editor .preview,.workspace.mode-editor .splitter{display:none}
  .workspace.mode-preview{grid-template-columns:1fr}
  .workspace.mode-preview .editor,.workspace.mode-preview .splitter{display:none}
  .pane{min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column}
  .editor{background:var(--panel)}
  #editor{
    flex:1; width:100%; resize:none; border:0; outline:none;
    background:var(--panel); color:var(--text);
    font:13.5px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    padding:18px 22px; tab-size:2; caret-color:var(--accent);
  }
  #editor::placeholder{color:var(--dim)}
  .splitter{cursor:col-resize; background:var(--line); position:relative}
  .splitter::after{content:""; position:absolute; inset:0 -3px}
  .splitter:hover{background:var(--accent)}
  .preview{background:var(--bg); overflow:auto; scrollbar-color:#394556 transparent}
  .markdown-body{
    max-width:880px; margin:0 auto; padding:26px 34px 80px;
    font-size:15.5px; line-height:1.68; color:var(--text); word-wrap:break-word;
  }
  .markdown-body > :first-child{margin-top:0}
  .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{line-height:1.25; margin:1.4em 0 .6em; font-weight:700}
  .markdown-body h1{font-size:1.95em; padding-bottom:.3em; border-bottom:1px solid var(--line)}
  .markdown-body h2{font-size:1.5em; padding-bottom:.25em; border-bottom:1px solid var(--line)}
  .markdown-body h3{font-size:1.22em}
  .markdown-body h4{font-size:1.05em}
  .markdown-body p,.markdown-body ul,.markdown-body ol,.markdown-body blockquote,.markdown-body pre,.markdown-body table{margin:0 0 1em}
  .markdown-body a{color:var(--accent); text-decoration:none}
  .markdown-body a:hover{text-decoration:underline}
  .markdown-body strong{font-weight:700}
  .markdown-body code{
    font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    font-size:.88em; background:var(--inline-bg); border:1px solid var(--inline-border);
    padding:.12em .38em; border-radius:5px;
  }
  .markdown-body pre{
    position:relative; background:var(--pre-bg); border:1px solid var(--pre-border); color:var(--pre-text);
    border-radius:9px; padding:14px 16px; overflow:auto; line-height:1.55;
  }
  .markdown-body pre code{background:transparent; border:0; padding:0; font-size:.86em}
  .markdown-body pre[data-lang]::before{
    content:attr(data-lang); position:absolute; top:6px; right:10px; color:var(--muted);
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; pointer-events:none;
  }
  .markdown-body blockquote{
    border-left:3px solid var(--accent); color:var(--muted); margin-left:0; padding:.1em 0 .1em 1em;
  }
  .markdown-body ul,.markdown-body ol{padding-left:1.7em}
  .markdown-body li{margin:.25em 0}
  .markdown-body li.task-item{list-style:none; margin-left:-1.4em}
  .markdown-body li.task-item input{margin-right:.5em; accent-color:var(--accent)}
  .markdown-body table{border-collapse:collapse; display:block; overflow:auto; max-width:100%}
  .markdown-body th,.markdown-body td{border:1px solid var(--line); padding:7px 11px}
  .markdown-body th{background:var(--panel2); font-weight:700}
  .markdown-body tr:nth-child(2n) td{background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .markdown-body hr{border:0; border-top:1px solid var(--line); margin:1.6em 0}
  .markdown-body img{max-width:100%; border-radius:6px}
  .markdown-body kbd{
    background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px;
    border-radius:5px; padding:.1em .4em; font-size:.85em;
  }
  .markdown-body details{border:1px solid var(--line); border-radius:8px; padding:.6em .9em; margin:0 0 1em}
  .markdown-body summary{cursor:pointer; font-weight:600}
  .table-wrap{overflow:auto; margin:0 0 1em}
  .table-wrap table{display:table; margin:0}
  .preview-empty{
    height:100%; display:grid; place-items:center; color:var(--dim); font-size:13px; padding:30px;
  }
  .statusbar{
    display:flex; align-items:center; gap:14px; padding:5px 14px; flex:0 0 auto;
    background:var(--panel); border-top:1px solid var(--line); color:var(--muted); font-size:11.5px;
  }
  .statusbar .grow{flex:1}
  .statusbar .saved{color:var(--dim)}
  .toc-pop{
    position:absolute; top:10px; right:16px; width:290px; max-height:62vh; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    box-shadow:0 18px 48px rgba(0,0,0,.45); padding:8px; z-index:30; display:none;
  }
  .toc-pop.on{display:block}
  .toc-title{padding:6px 8px 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.09em}
  .toc-item{
    display:block; width:100%; text-align:left; background:transparent; border:0;
    color:var(--text); padding:5px 8px; border-radius:6px; font-size:12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .toc-item:hover{background:var(--panel2); color:var(--accent)}
  .toc-item.lvl2{padding-left:22px}
  .toc-item.lvl3{padding-left:36px; color:var(--muted)}
  .toc-item.lvl4,.toc-item.lvl5,.toc-item.lvl6{padding-left:50px; color:var(--muted); font-size:12px}
  .toc-empty{padding:10px; color:var(--dim); font-size:12px}
  .toast{
    position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(8px);
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:9px 14px; font-size:12.5px; opacity:0; pointer-events:none;
    transition:opacity .18s,transform .18s; z-index:60; box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:color-mix(in srgb,var(--danger) 55%,var(--line)); color:var(--danger)}
  @media (max-width:860px){
    .actions .label{display:none}
    .filebox .name{max-width:30vw}
    .workspace.mode-split{grid-template-columns:1fr}
    .workspace.mode-split .preview,.workspace.mode-split .splitter{display:none}
    .markdown-body{padding:20px 18px 60px}
  }
  @media print{
    .top,.toolbar,.statusbar,.splitter,.editor,.toc-pop,.toast{display:none!important}
    body{overflow:visible; background:#fff; color:#111}
    .workspace,.preview{display:block!important; overflow:visible; height:auto}
    .markdown-body{max-width:none; padding:0; color:#111}
    .markdown-body a{color:#0645ad}
    .markdown-body pre{white-space:pre-wrap; border-color:#ccc}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><span>Markdown Studio</span></div>
  <div class="filebox">
    <span class="dot" id="stateDot" title="Borrador guardado localmente"></span>
    <span class="name" id="fileName">bienvenida.md</span>
    <span id="fileHint">· local</span>
  </div>
  <div class="actions">
    <button class="btn" id="newBtn" title="Nuevo documento">Nuevo</button>
    <button class="btn" id="openBtn" title="Abrir Markdown (Ctrl+O)">Abrir</button>
    <button class="btn primary" id="saveBtn" title="Guardar (Ctrl+S)">Guardar</button>
    <button class="btn icon" id="exportBtn" title="Exportar HTML" aria-label="Exportar HTML">HTML</button>
    <button class="btn icon" id="tocBtn" title="Índice del documento" aria-label="Índice">☰</button>
    <button class="btn icon" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
    <div class="seg" role="group" aria-label="Vista">
      <button data-mode="editor" title="Solo editor">Editor</button>
      <button data-mode="split" class="active" title="Editor y vista previa">Split</button>
      <button data-mode="preview" title="Solo vista previa">Vista</button>
    </div>
  </div>
  <input id="fileInput" type="file" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden>
</header>

<div class="toolbar" id="toolbar">
  <button class="tool" data-action="bold" title="Negrita (Ctrl+B)"><b>B</b></button>
  <button class="tool" data-action="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
  <button class="tool" data-action="strike" title="Tachado"><s>S</s></button>
  <span class="sep"></span>
  <button class="tool" data-action="h1" title="Encabezado 1">H1</button>
  <button class="tool" data-action="h2" title="Encabezado 2">H2</button>
  <button class="tool" data-action="quote" title="Cita">❝</button>
  <span class="sep"></span>
  <button class="tool" data-action="link" title="Enlace (Ctrl+K)">🔗</button>
  <button class="tool" data-action="image" title="Imagen">▧</button>
  <button class="tool" data-action="code" title="Código en línea">&lt;/&gt;</button>
  <button class="tool" data-action="codeblock" title="Bloque de código">{ }</button>
  <span class="sep"></span>
  <button class="tool" data-action="ul" title="Lista">•</button>
  <button class="tool" data-action="ol" title="Lista numerada">1.</button>
  <button class="tool" data-action="task" title="Lista de tareas">☑</button>
  <button class="tool" data-action="table" title="Tabla">▦</button>
  <button class="tool" data-action="hr" title="Separador">―</button>
</div>

<main>
  <div class="workspace mode-split" id="workspace">
    <section class="pane editor">
      <textarea id="editor" spellcheck="false" placeholder="Escribe Markdown aquí…" aria-label="Editor Markdown"></textarea>
    </section>
    <div class="splitter" id="splitter" title="Arrastra para cambiar el ancho"></div>
    <section class="pane preview" id="previewPane">
      <article class="markdown-body" id="preview"></article>
    </section>
  </div>
  <div class="toc-pop" id="tocPop">
    <div class="toc-title">Índice</div>
    <div id="tocList"></div>
  </div>
</main>

<footer class="statusbar">
  <span id="wordStats">0 palabras</span>
  <span id="lineStats">1 línea</span>
  <span class="grow"></span>
  <span id="cursorStats">Ln 1, Col 1</span>
  <span class="saved" id="saveState">Borrador local</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="text/markdown" id="welcomeDoc"># Markdown Studio

Editor y visor **local** de Markdown. Escribe a la izquierda y mira el resultado a la derecha.

## Qué puedes hacer

- Abrir y guardar archivos .md
- Exportar a HTML o imprimir a PDF
- Tablas, listas de tareas, citas y código
- Autoguardado en tu navegador; nada se sube

> Consejo: usa Ctrl+B, Ctrl+I y Ctrl+K.

```js
const saludo = "Hola, Markdown";
console.log(saludo);
```

| Función | Atajo |
| --- | --- |
| Negrita | Ctrl+B |
| Cursiva | Ctrl+I |
| Enlace | Ctrl+K |

- [x] Editor con vista previa
- [x] Autoguardado local
- [ ] Escribir algo nuevo
</script>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'mdstudio.v1';
  var $ = function (id) { return document.getElementById(id); };
  var editor = $('editor');
  var preview = $('preview');
  var workspace = $('workspace');
  var state = { name: 'bienvenida.md', handle: null, theme: 'dark', mode: 'split', split: 50 };
  var saveTimer = null, renderTimer = null, toastTimer = null;

  function toast(message, isError) {
    var el = $('toast');
    el.textContent = message;
    el.classList.toggle('err', !!isError);
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, isError ? 6000 : 2200);
  }

  function status(text) { $('saveState').textContent = text; }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function slug(text) {
    return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'seccion';
  }

  function render() {
    var source = editor.value;
    if (!source.trim()) {
      preview.innerHTML = '<div class="preview-empty">La vista previa aparecerá aquí…</div>';
      $('tocList').innerHTML = '<div class="toc-empty">Sin encabezados</div>';
      return;
    }
    var html;
    try {
      html = marked.parse(source, { gfm: true, breaks: false });
    } catch (error) {
      preview.innerHTML = '<div class="preview-empty">Error al interpretar el Markdown.</div>';
      return;
    }
    preview.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
    enhance();
    updateToc();
  }

  function enhance() {
    var used = {};
    preview.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (heading) {
      var base = slug(heading.textContent.trim());
      var id = base, n = 2;
      while (used[id]) { id = base + '-' + (n++); }
      used[id] = true;
      heading.id = id;
    });
    preview.querySelectorAll('a[href]').forEach(function (link) {
      var href = link.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href)) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });
    preview.querySelectorAll('img').forEach(function (img) {
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
    });
    preview.querySelectorAll('table').forEach(function (table) {
      if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
    preview.querySelectorAll('pre code').forEach(function (block) {
      var pre = block.parentElement;
      var cls = null;
      block.classList.forEach(function (c) { if (c.indexOf('language-') === 0) cls = c; });
      if (cls) pre.setAttribute('data-lang', cls.slice(9));
      try { hljs.highlightElement(block); } catch (error) { /* lenguaje no soportado */ }
    });
    preview.querySelectorAll('li > input[type="checkbox"]').forEach(function (box) {
      box.disabled = true;
      if (box.parentElement) box.parentElement.classList.add('task-item');
    });
  }

  function updateToc() {
    var items = [];
    preview.querySelectorAll('h1,h2,h3').forEach(function (heading) {
      items.push({ level: Number(heading.tagName.charAt(1)), text: heading.textContent.trim(), id: heading.id });
    });
    var list = $('tocList');
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="toc-empty">Sin encabezados</div>';
      return;
    }
    items.forEach(function (item) {
      var button = document.createElement('button');
      button.className = 'toc-item lvl' + item.level;
      button.type = 'button';
      button.textContent = item.text;
      button.addEventListener('click', function () {
        var target = document.getElementById(item.id);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        $('tocPop').classList.remove('on');
      });
      list.appendChild(button);
    });
  }

  function updateStats() {
    var text = editor.value;
    var words = (text.match(/\S+/g) || []).length;
    var lines = text ? text.split('\n').length : 1;
    $('wordStats').textContent = words + (words === 1 ? ' palabra' : ' palabras');
    $('lineStats').textContent = lines + (lines === 1 ? ' línea' : ' líneas');
    updateCursor();
  }

  function updateCursor() {
    var pos = editor.selectionStart;
    var before = editor.value.slice(0, pos);
    var line = before.split('\n').length;
    var col = pos - before.lastIndexOf('\n');
    $('cursorStats').textContent = 'Ln ' + line + ', Col ' + col;
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 90);
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          text: editor.value, name: state.name, theme: state.theme,
          mode: state.mode, split: state.split
        }));
        var now = new Date();
        status('Borrador local · ' + now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }));
      } catch (error) {
        status('No se pudo autoguardar');
      }
    }, 420);
  }

  function setMode(mode) {
    state.mode = mode;
    workspace.className = 'workspace mode-' + mode;
    document.querySelectorAll('.seg button').forEach(function (button) {
      button.classList.toggle('active', button.getAttribute('data-mode') === mode);
    });
    if (mode !== 'editor') render();
    scheduleSave();
  }

  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    $('themeBtn').textContent = theme === 'dark' ? '☾' : '☀';
    scheduleSave();
  }

  function applySplit(pct) {
    state.split = Math.max(18, Math.min(82, pct));
    workspace.style.setProperty('--split', state.split + '%');
  }

  function updateMeta() {
    $('fileName').textContent = state.name;
    $('fileHint').textContent = state.handle ? '· archivo' : '· borrador local';
  }

  function loadDoc(text, name, handle) {
    editor.value = text;
    state.name = name || 'documento.md';
    state.handle = handle || null;
    updateMeta();
    render();
    updateStats();
    editor.focus();
    status('Borrador local');
    scheduleSave();
  }

  function download(name, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  async function openDoc() {
    if (window.showOpenFilePicker) {
      try {
        var handles = await window.showOpenFilePicker({
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.txt'] } }],
          multiple: false
        });
        var file = await handles[0].getFile();
        loadDoc(await file.text(), file.name, handles[0]);
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;
      }
    }
    $('fileInput').click();
  }

  async function saveDoc(saveAs) {
    var text = editor.value;
    try {
      if (!saveAs && state.handle && state.handle.createWritable) {
        var writable = await state.handle.createWritable();
        await writable.write(text);
        await writable.close();
        status('Guardado · ' + state.name);
        return;
      }
      if (window.showSaveFilePicker) {
        var handle = await window.showSaveFilePicker({
          suggestedName: /\.(md|markdown|mdown|txt)$/i.test(state.name) ? state.name : 'documento.md',
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.txt'] } }]
        });
        var stream = await handle.createWritable();
        await stream.write(text);
        await stream.close();
        state.handle = handle;
        state.name = handle.name;
        updateMeta();
        status('Guardado · ' + state.name);
        return;
      }
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      console.warn(error);
    }
    var fallback = /\.(md|markdown|mdown|txt)$/i.test(state.name) ? state.name : 'documento.md';
    download(fallback, text, 'text/markdown;charset=utf-8');
    status('Descargado · ' + fallback);
  }

  var EXPORT_CSS = 'body{margin:0;background:#fff;color:#1f2328;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}' +
    'main{max-width:880px;margin:0 auto;padding:40px 28px 80px}' +
    'h1,h2{border-bottom:1px solid #d8dee4;padding-bottom:.3em}h1{font-size:2em}h2{font-size:1.5em}' +
    'a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}' +
    'code{font-family:ui-monospace,Consolas,monospace;background:#f6f8fa;border:1px solid #d0d7de;border-radius:5px;padding:.1em .35em;font-size:.88em}' +
    'pre{background:#0d1117;color:#e6edf3;border-radius:8px;padding:14px 16px;overflow:auto}pre code{background:transparent;border:0;padding:0;color:inherit}' +
    'blockquote{border-left:3px solid #0969da;color:#59636e;margin-left:0;padding-left:1em}' +
    'table{border-collapse:collapse;display:block;overflow:auto}th,td{border:1px solid #d0d7de;padding:7px 11px}th{background:#f6f8fa}' +
    'img{max-width:100%}hr{border:0;border-top:1px solid #d8dee4}' +
    '.hljs-comment,.hljs-quote{color:#8b949e}.hljs-keyword,.hljs-selector-tag{color:#ff7b72}.hljs-string,.hljs-attr{color:#a5d6ff}' +
    '.hljs-number,.hljs-literal{color:#79c0ff}.hljs-title,.hljs-function{color:#d2a8ff}.hljs-built_in{color:#ffa657}';

  function exportHtml() {
    var title = state.name.replace(/\.(md|markdown|mdown|txt)$/i, '') || 'documento';
    var html = '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + esc(title) + '</title><style>' + EXPORT_CSS + '</style></head><body><main>' +
      preview.innerHTML + '</main></body></html>';
    download(title + '.html', html, 'text/html;charset=utf-8');
    toast('HTML exportado');
  }

  function wrap(before, after, placeholder) {
    var start = editor.selectionStart, end = editor.selectionEnd;
    var selected = editor.value.slice(start, end) || placeholder || 'texto';
    editor.setRangeText(before + selected + after, start, end, 'end');
    editor.focus();
    editor.dispatchEvent(new Event('input'));
  }

  function prefixLines(makePrefix) {
    var start = editor.selectionStart, end = editor.selectionEnd;
    var from = editor.value.lastIndexOf('\n', start - 1) + 1;
    var to = editor.value.indexOf('\n', end);
    if (to < 0) to = editor.value.length;
    var block = editor.value.slice(from, to);
    var lines = block.split('\n');
    var out = lines.map(function (line, index) { return makePrefix(index) + line; }).join('\n');
    editor.setRangeText(out, from, to, 'end');
    editor.focus();
    editor.dispatchEvent(new Event('input'));
  }

  function insert(text) {
    var start = editor.selectionStart, end = editor.selectionEnd;
    editor.setRangeText(text, start, end, 'end');
    editor.focus();
    editor.dispatchEvent(new Event('input'));
  }

  var actions = {
    bold: function () { wrap('**', '**', 'texto'); },
    italic: function () { wrap('*', '*', 'texto'); },
    strike: function () { wrap('~~', '~~', 'texto'); },
    h1: function () { prefixLines(function () { return '# '; }); },
    h2: function () { prefixLines(function () { return '## '; }); },
    quote: function () { prefixLines(function () { return '> '; }); },
    link: function () { wrap('[', '](https://)', 'texto'); },
    image: function () { wrap('![', '](https://)', 'descripción'); },
    code: function () { wrap(String.fromCharCode(96), String.fromCharCode(96), 'código'); },
    codeblock: function () {
      var fence = String.fromCharCode(96, 96, 96);
      var start = editor.selectionStart, end = editor.selectionEnd;
      var body = editor.value.slice(start, end) || 'código';
      insert('\n' + fence + '\n' + body + '\n' + fence + '\n');
    },
    ul: function () { prefixLines(function () { return '- '; }); },
    ol: function () { prefixLines(function (index) { return (index + 1) + '. '; }); },
    task: function () { prefixLines(function () { return '- [ ] '; }); },
    table: function () { insert('\n| Columna 1 | Columna 2 |\n| --- | --- |\n| Texto | Texto |\n'); },
    hr: function () { insert('\n---\n'); }
  };

  $('toolbar').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-action]');
    if (!button) return;
    var action = actions[button.getAttribute('data-action')];
    if (action) action();
  });

  editor.addEventListener('input', function () {
    updateStats();
    scheduleRender();
    scheduleSave();
  });
  editor.addEventListener('keyup', updateCursor);
  editor.addEventListener('click', updateCursor);
  editor.addEventListener('select', updateCursor);
  editor.addEventListener('scroll', function () {
    if (state.mode !== 'split') return;
    var max = editor.scrollHeight - editor.clientHeight;
    if (max <= 0) return;
    var pane = $('previewPane');
    pane.scrollTop = (editor.scrollTop / max) * (pane.scrollHeight - pane.clientHeight);
  });

  editor.addEventListener('keydown', function (event) {
    var mod = event.ctrlKey || event.metaKey;
    if (mod && !event.shiftKey && event.key.toLowerCase() === 'b') { event.preventDefault(); actions.bold(); return; }
    if (mod && !event.shiftKey && event.key.toLowerCase() === 'i') { event.preventDefault(); actions.italic(); return; }
    if (mod && !event.shiftKey && event.key.toLowerCase() === 'k') { event.preventDefault(); actions.link(); return; }
    if (mod && event.key.toLowerCase() === 's') { event.preventDefault(); saveDoc(event.shiftKey); return; }
    if (mod && event.key.toLowerCase() === 'o') { event.preventDefault(); openDoc(); return; }
    if (event.key === 'Tab') {
      event.preventDefault();
      var start = editor.selectionStart, end = editor.selectionEnd;
      if (event.shiftKey) {
        var before = editor.value.slice(0, start);
        var removed = before.replace(/ {1,2}$/, '');
        if (removed.length !== before.length) editor.setRangeText('', removed.length, start, 'end');
      } else {
        editor.setRangeText('  ', start, end, 'end');
      }
      editor.dispatchEvent(new Event('input'));
    }
    if (event.key === 'Escape') $('tocPop').classList.remove('on');
  });

  $('newBtn').addEventListener('click', function () {
    if (editor.value.trim() && !confirm('¿Vaciar el documento actual?')) return;
    editor.value = '';
    state.name = 'documento.md';
    state.handle = null;
    updateMeta();
    render();
    updateStats();
    editor.focus();
    scheduleSave();
  });

  $('openBtn').addEventListener('click', openDoc);
  $('saveBtn').addEventListener('click', function () { saveDoc(false); });
  $('exportBtn').addEventListener('click', exportHtml);
  $('themeBtn').addEventListener('click', function () { setTheme(state.theme === 'dark' ? 'light' : 'dark'); });
  $('tocBtn').addEventListener('click', function (event) {
    event.stopPropagation();
    $('tocPop').classList.toggle('on');
  });
  document.addEventListener('click', function (event) {
    if (!$('tocPop').contains(event.target) && event.target !== $('tocBtn')) $('tocPop').classList.remove('on');
  });

  $('fileInput').addEventListener('change', function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { loadDoc(e.target.result, file.name, null); };
    reader.onerror = function () { toast('No se pudo abrir el archivo', true); };
    reader.readAsText(file);
  });

  document.querySelectorAll('.seg button').forEach(function (button) {
    button.addEventListener('click', function () { setMode(button.getAttribute('data-mode')); });
  });

  var dragging = false;
  $('splitter').addEventListener('pointerdown', function (event) {
    dragging = true;
    $('splitter').setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  $('splitter').addEventListener('pointermove', function (event) {
    if (!dragging) return;
    var rect = workspace.getBoundingClientRect();
    applySplit(((event.clientX - rect.left) / rect.width) * 100);
  });
  $('splitter').addEventListener('pointerup', function (event) {
    dragging = false;
    try { $('splitter').releasePointerCapture(event.pointerId); } catch (e) {}
    scheduleSave();
  });

  ['dragenter', 'dragover'].forEach(function (type) {
    window.addEventListener(type, function (event) { event.preventDefault(); });
  });
  window.addEventListener('drop', function (event) {
    event.preventDefault();
    var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { loadDoc(e.target.result, file.name, null); };
    reader.readAsText(file);
  });

  var welcome = $('welcomeDoc').textContent.trim();
  var params = new URLSearchParams(location.search);
  var demo = params.get('demo') === '1';
  var saved = null;
  if (!demo) {
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
  }
  if (saved) {
    state.name = saved.name || state.name;
    state.theme = saved.theme === 'light' ? 'light' : 'dark';
    state.mode = saved.mode === 'editor' || saved.mode === 'preview' ? saved.mode : 'split';
    state.split = typeof saved.split === 'number' ? saved.split : 50;
    editor.value = saved.text || '';
  } else {
    editor.value = welcome;
  }
  setTheme(params.get('theme') === 'light' ? 'light' : state.theme);
  setMode(state.mode);
  applySplit(state.split);
  updateMeta();
  render();
  updateStats();
  if (demo) setTimeout(function () { status('Demo'); }, 50);
})();
</script>
</body>
</html>
